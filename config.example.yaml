# Naukri Auto Apply Bot - configuration
# Copy this file to config.yaml and fill in your details:
#   copy config.example.yaml config.yaml
#
# Credentials go in .env (NAUKRI_EMAIL / NAUKRI_PASSWORD), never here.
# NOTE: job roles / keywords / title filters / experience are set in .env (JOB_KEYWORDS, JOB_TITLE_INCLUDE,
# JOB_TITLE_EXCLUDE, ...). Values in .env override the same settings below.

search:
  # Every keyword is searched separately on Naukri.
  keywords:
    - ai ml engineer
    - machine learning engineer
    - artificial intelligence
    - data scientist
    - deep learning engineer
    - computer vision engineer
    - nlp engineer
    - generative ai
    - python developer
    - python django flask
    - web developer
    - react developer
    - full stack developer
  # Empty list = all over India / anywhere (no location filter).
  # Add city names to also run city-specific searches, e.g. [bangalore, pune, ahmedabad, surat]
  locations: []
  experience_years: 0        # Naukri "experience" filter
  job_age_days: 7            # only jobs posted in the last N days (1, 3, 7, 15, 30)
  pages_per_search: 2        # 20 jobs per page

filters:
  max_min_experience: 1      # skip job if its minimum required experience > this
  min_score: 2               # minimum relevance score to apply (see naukri_bot/filters.py)
  # Job title must contain at least one of these (case-insensitive, word match)
  title_include:
    - ai
    - ml
    - machine learning
    - artificial intelligence
    - deep learning
    - data scientist
    - data science
    - computer vision
    - nlp
    - generative ai
    - genai
    - gen ai
    - llm
    - python
    - django
    - flask
    - fastapi
    - web developer
    - web development
    - frontend
    - front end
    - front-end
    - react
    - full stack
    - fullstack
    - full-stack
    - mern
    - software engineer
    - software developer
    - trainee
    - intern
  # Skip job if title contains any of these
  title_exclude:
    - senior
    - sr
    - lead
    - manager
    - architect
    - principal
    - staff
    - head
    - director
    - vp
    - java
    - .net
    - dotnet
    - php
    - salesforce
    - sap
    - android
    - ios
    - sales
    - marketing
    - teacher
    - tutor
    - faculty
    - professor
    - trainer
    - bpo
    - voice
    - annotator
    - annotation
    - instructor
    - mentor
    - react native
    - non paid
    - unpaid
    - machine shop
  # Skip these companies (lowercase substring match)
  company_exclude: []

# Your skills (from resume) - used to score job relevance and to answer
# "how many years of experience in X" questions.
# ⚠️ Replace these with YOUR skills from YOUR resume.
skills:
  - python
  - machine learning
  - deep learning
  - nlp
  - tensorflow
  - pytorch
  - scikit-learn
  - sql
  - html
  - css
  - javascript
  - react
  - flask
  - git
  - data analysis

apply:
  max_applies_per_run: 25    # Naukri allows ~50 applies per day
  delay_seconds: [4, 9]      # random wait between jobs
  headless: false

# ⚠️ FILL IN YOUR OWN DETAILS BELOW
# Answers for recruiter questions asked in the Naukri apply chatbot.
profile:
  name: Your Full Name
  email: your_email@example.com
  phone: "9999999999"
  current_location: Your City
  preferred_location: Anywhere in India / Remote
  willing_to_relocate: "Yes"
  # Countries where you can work without a visa. Used for "authorized to work in X?" and
  # "need visa sponsorship?" questions (a job abroad -> needs sponsorship = Yes).
  work_authorized_countries: [India]
  shift_preference: Flexible - comfortable with any shift or time zone
  # answer for "On a scale of 1-10, rate your ..." questions
  self_rating: 7
  total_experience_years: 0
  total_experience_months: 0
  current_company: ""
  current_designation: ""
  notice_period: Immediate
  notice_period_days: 0
  current_ctc_lpa: ""                # fill in, e.g. 2.4  (questions about CTC are skipped while empty)
  expected_ctc_lpa: ""               # fill in, e.g. 4
  highest_qualification: B.Tech
  degree_branch: Your Branch
  college: Your College
  graduation_year: "2025"
  cgpa: ""                           # fill if you want CGPA/percentage questions answered
  twelfth_percentage: ""
  tenth_percentage: ""
  gender: ""                         # optional
  date_of_birth: ""                  # optional, DD/MM/YYYY
  linkedin: ""
  github: ""
  languages: English, Hindi
  # Years of experience answered for skills listed above that are NOT in skill_experience
  default_skill_experience: 0
  # Years answered for skills you don't have
  unknown_skill_experience: 0
  skill_experience: {}               # e.g. {python: 1, react: 1}
  # Free-text answers for open questions. Naukri allows only ~100 characters per text answer
  # (longer ones are auto-shortened by the bot). Set to "" to skip such jobs instead.
  about_me: ""                       # e.g. "AI/ML engineer, B.Tech CS 2025, 1 year experience in Python/ML."
  project_summary: ""                # e.g. "Built a real-time object detection system using YOLOv8 and OpenCV."
  why_join: ""                       # e.g. "Want to apply my ML skills to real products; can join immediately."

# Company-site bot (company_apply.py)
company_apply:
  resume_pdf: your_resume.pdf        # ← put your resume PDF in the project root and update this filename
  max_per_run: 15
  heard_about_us: Naukri.com
  # used for "cover letter / message" boxes on company forms and for email applications
  # ⚠️ Replace with YOUR cover letter
  cover_letter: |-
    Dear Hiring Team,

    I am applying for the {title} role at {company}. I am a [year] [degree] graduate from
    [your college], currently working as [your role] at [your company].

    [Briefly describe your key project or achievement in 1-2 sentences.]

    I work with [your key skills], and I can join [your notice period].
    My resume is attached. Thank you for your time.

    Regards,
    [Your Name]
    [Your Phone] | [Your Email]
  # Email applications ("send your resume to hr@...") need a Gmail App Password in .env:
  #   SMTP_EMAIL=your_gmail@gmail.com
  #   SMTP_APP_PASSWORD=xxxx xxxx xxxx xxxx   (Google Account > Security > App passwords)
  # Without it those jobs are listed as manual.
  send_emails: true

# Extra custom answers: if the question contains the key (lowercase substring), answer with the value.
# Checked BEFORE built-in rules, so use it to override anything.
custom_answers: {}
