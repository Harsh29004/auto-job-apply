<!doctype html><html><body>
<h2>Application - AI/ML Engineer</h2>
<form id="f">
  <label for="fn">First Name *</label><input id="fn" name="first_name" required>
  <label for="ln">Last Name *</label><input id="ln" name="last_name" required>
  <label for="em">Email Address *</label><input id="em" type="email" name="email" required>
  <label for="ph">Mobile Number *</label><input id="ph" type="tel" name="phone" required>
  <label for="ex">Total Experience *</label>
  <select id="ex" name="experience" required><option value="">Select</option><option>Fresher</option><option>1-2 years</option><option>3-5 years</option></select>
  <fieldset><legend>Are you willing to relocate? *</legend>
    <label><input type="radio" name="reloc" value="y" required> Yes</label>
    <label><input type="radio" name="reloc" value="n"> No</label></fieldset>
  <label for="np">Notice period</label><input id="np" name="notice">
  <label for="pos">Position Applying For *</label>
  <select id="pos" name="position" required><option value="">Select</option><option>QA Engineer</option><option>AI/ML Engineer</option><option>Python Developer</option><option>HR Executive</option></select>
  <div class="field"><span>Highest Qualification *</span>
    <div id="qual" role="combobox" aria-required="true" tabindex="0" style="border:1px solid #999;padding:4px">Select</div>
    <ul id="qual-list" role="listbox" style="display:none">
      <li role="option">12th</li><li role="option">B.Tech/B.E.</li><li role="option">MCA</li></ul>
    <input type="hidden" name="qualification" id="qual-val"></div>
  <label for="cl">Cover Letter</label><textarea id="cl" name="cover"></textarea>
  <label for="src">How did you hear about us?</label><input id="src" name="source">
  <label for="cv">Upload Resume *</label><input id="cv" type="file" name="resume" required>
  <label><input type="checkbox" name="consent" required> I agree to the privacy policy</label>
  <button type="submit">Submit Application</button>
</form>
<script>
document.getElementById('qual').addEventListener('click', () => { document.getElementById('qual-list').style.display = 'block'; });
document.querySelectorAll('#qual-list li').forEach(li => li.addEventListener('click', () => {
  document.getElementById('qual').innerText = li.innerText; document.getElementById('qual-val').value = li.innerText;
  document.getElementById('qual-list').style.display = 'none'; }));
document.getElementById('f').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (!f.checkValidity()) { document.body.insertAdjacentHTML('beforeend','<p>This field is required</p>'); return; }
  window.__submitted = Object.fromEntries(new FormData(f).entries());
  window.__submitted.resume = f.resume.files[0] && f.resume.files[0].name;
  localStorage.setItem('submitted', JSON.stringify(window.__submitted));
  document.body.innerHTML = '<h2>Thank you for applying! We will get back to you.</h2>';
});
</script>
</body></html>
