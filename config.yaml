# Naukri Auto Apply Bot - configuration
# Credentials go in .env (NAUKRI_EMAIL / NAUKRI_PASSWORD), never here.

search:
  # Every keyword is searched separately on Naukri.
  keywords:
    - ai ml engineer
    - machine learning engineer
    - artificial intelligence
    - data scientist
    - deep learning engineer
    - computer vision engineer
    - nlp engineer
    - generative ai
    - python developer
    - python django flask
    - web developer
    - react developer
    - full stack developer
  # Empty list = all over India / anywhere (no location filter).
  # Add city names to also run city-specific searches, e.g. [bangalore, pune, ahmedabad, surat]
  locations: []
  experience_years: 1        # Naukri "experience" filter
  job_age_days: 7            # only jobs posted in the last N days (1, 3, 7, 15, 30)
  pages_per_search: 2        # 20 jobs per page

filters:
  max_min_experience: 1      # skip job if its minimum required experience > this
  min_score: 2               # minimum relevance score to apply (see naukri_bot/filters.py)
  # Job title must contain at least one of these (case-insensitive, word match)
  title_include:
    - ai
    - ml
    - machine learning
    - artificial intelligence
    - deep learning
    - data scientist
    - data science
    - computer vision
    - nlp
    - generative ai
    - genai
    - gen ai
    - llm
    - python
    - django
    - flask
    - fastapi
    - web developer
    - web development
    - frontend
    - front end
    - front-end
    - react
    - full stack
    - fullstack
    - full-stack
    - mern
    - software engineer
    - software developer
    - trainee
    - intern
  # Skip job if title contains any of these
  title_exclude:
    - senior
    - sr
    - lead
    - manager
    - architect
    - principal
    - staff
    - head
    - director
    - vp
    - java
    - .net
    - dotnet
    - php
    - salesforce
    - sap
    - android
    - ios
    - sales
    - marketing
    - teacher
    - tutor
    - faculty
    - professor
    - trainer
    - bpo
    - voice
    - annotator
    - annotation
    - instructor
    - mentor
    - react native
    - non paid
    - unpaid
    - machine shop
  # Skip these companies (lowercase substring match)
  company_exclude: []

# Your skills (from resume) - used to score job relevance and to answer
# "how many years of experience in X" questions.
skills:
  - python
  - machine learning
  - deep learning
  - nlp
  - natural language processing
  - computer vision
  - tensorflow
  - keras
  - pytorch
  - scikit-learn
  - sklearn
  - opencv
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - xgboost
  - cnn
  - transformer
  - mediapipe
  - sql
  - c
  - html
  - css
  - javascript
  - react
  - vite
  - flask
  - rest api
  - api
  - git
  - data analysis
  - data science
  - artificial intelligence
  - ai
  - ml

apply:
  max_applies_per_run: 25    # Naukri allows ~50 applies per day
  delay_seconds: [4, 9]      # random wait between jobs
  headless: false

